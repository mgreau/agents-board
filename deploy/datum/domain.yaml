# Domain ownership for agents-board.mgreau.dev (DNS at Gandi).
#
# Applied once by hand (`datumctl apply -f deploy/datum/domain.yaml`), before the
# hostname in httpproxy.yaml can verify. Steps in README.md, "Public hostname".
#
# A Domain for the apex suffix-matches every subdomain, so this one resource
# covers agents-board.mgreau.dev. Verification challenge appears in
# status.verification.dnsRecord (TXT) or status.verification.httpToken:
#   datumctl describe domain mgreau-dev --project personal-project-800ef4be -n default
apiVersion: networking.datumapis.com/v1alpha
kind: Domain
metadata:
  name: mgreau-dev
  namespace: default
  labels:
    app.kubernetes.io/part-of: agents-board
spec:
  domainName: mgreau.dev
